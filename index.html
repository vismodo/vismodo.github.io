        <svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://w3.org">
  <defs>
    <!-- Define the hole mask -->
    <mask id="circle-holes">
      <!-- Everything white stays visible -->
      <rect width="100%" height="100%" fill="white" />
      <!-- Everything black becomes a transparent hole -->
      <g fill="black">
        <circle cx="75" cy="75" r="15" />
        <circle cx="185" cy="75" r="15" />
        <circle cx="295" cy="75" r="15" />
        <circle cx="405" cy="75" r="15" />
        <circle cx="515" cy="75" r="15" />
      </g>
    </mask>
  </defs>

  <!-- The solid yellow circles, punched through by the mask -->
  <g fill="#FFD700" mask="url(#circle-holes)">
    <circle cx="75" cy="75" r="40" />
    <circle cx="185" cy="75" r="40" />
    <circle cx="295" cy="75" r="40" />
    <circle cx="405" cy="75" r="40" />
    <circle cx="515" cy="75" r="40" />
  </g>
</svg>
